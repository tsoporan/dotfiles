# Black + electric yellow, matching waybar / hypr borders

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    noise = 0.03
    contrast = 0.9
    brightness = 0.7
    color = rgba(10, 10, 10, 1.0)
}

label {
    monitor =
    text = $TIME
    font_family = JetBrainsMono Nerd Font
    font_size = 72
    color = rgba(224, 224, 224, 1.0)
    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.6)
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    font_family = JetBrainsMono Nerd Font
    font_size = 24
    color = rgba(192, 192, 192, 1.0)
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.5)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_family = JetBrainsMono Nerd Font
    font_size = 18
    color = rgba(128, 128, 128, 1.0)
    position = 0, 50
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    position = 0, -50
    halign = center
    valign = center
    outline_thickness = 3
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(230, 251, 4, 1.0)
    inner_color = rgba(10, 10, 10, 0.85)
    font_color = rgba(224, 224, 224, 1.0)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    rounding = 0
    check_color = rgba(230, 251, 4, 1.0)
    fail_color = rgba(255, 85, 85, 1.0)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(230, 251, 4, 1.0)
}
