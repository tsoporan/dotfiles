# herdr: terminal workspace manager for coding agents. On trial next to Zellij.
# Only what differs from the defaults; `herdr --default-config` prints the rest.

# Desktop notifications come from ~/.local/bin/claude-notify, so skip the
# first-run notification setup.
onboarding = false

[theme]
# "terminal" takes Ghostty's palette; [theme.custom] then sets every token so
# herdr's chrome matches the rest of the desktop (Hyprland, waybar, Zellij).
name = "terminal"

# Black + electric yellow. Greys step up from Ghostty's #0a0a0a background;
# yellow marks what has focus and agents that are working. Status colors are
# waybar's.
[theme.custom]
# Surfaces
panel_bg = "#0a0a0a"      # tab bar, popups
sidebar_bg = "#0d0d0d"    # one step off the panes, so the sidebar reads as chrome
surface_dim = "#1c1c1c"   # sidebar and section dividers
surface0 = "#1f1f1f"      # input fields, secondary buttons
surface1 = "#2a2a2a"
active_row_bg = "#1a1a1a" # selected workspace or agent row
selection_bg = "#2a2a2a"  # same as Ghostty's selection
# Text
text = "#e0e0e0"
subtext0 = "#909090"
overlay0 = "#4a4a4a"      # section labels, unfocused pane borders
overlay1 = "#707070"      # tab-bar status, "+" new tab
# Focus
accent = "#e6fb04"
# Status
red = "#ff5555"
peach = "#ffb86c"
yellow = "#e6fb04"
green = "#50fa7b"
teal = "#8be9fd"
blue = "#62a0ea"
mauve = "#c061cb"

[keys]
# The default ctrl+b is Claude Code's "run in background" key. ctrl+g matches
# the Zellij unlock key, so both multiplexers start from the same chord.
prefix = "ctrl+g"
# Ctrl+Alt+arrows switch tabs (left/right) and agents (up/down) without the
# prefix; the prefix keys still work. Ghostty unbinds these so herdr gets them.
previous_agent = ["prefix+shift+k", "ctrl+alt+up"]
next_agent = ["prefix+shift+j", "ctrl+alt+down"]
previous_tab = ["prefix+p", "ctrl+alt+left"]
next_tab = ["prefix+n", "ctrl+alt+right"]
# Workspaces: Ctrl+Alt+1..9 jumps to one by its place in the sidebar, and
# Ctrl+Alt+Shift+Up/Down steps through them.
switch_workspace = "ctrl+alt+1..9"
previous_workspace = "ctrl+alt+shift+up"
next_workspace = "ctrl+alt+shift+down"

# Jump to the agent that most needs you: blocked first, then the one that
# finished most recently (see ~/.local/bin/herdr-attention).
[[keys.command]]
key = "ctrl+alt+enter"
type = "shell"
command = "~/.local/bin/herdr-attention"
description = "focus agent needing attention"

# What is holding RAM: orphaned dev servers, processes in deleted worktrees,
# containers and per-pane totals, with Ctrl-X to kill (see ~/.local/bin/herdr-cleanup).
[[keys.command]]
key = "ctrl+alt+backspace"
type = "popup"
command = "~/.local/bin/herdr-cleanup"
description = "clean up leftover processes"
width = "95%"
height = "95%"

# Tell the focused agent its PR merged (see ~/.local/bin/herdr-pr).
[[keys.command]]
key = "prefix+m"
type = "shell"
command = "~/.local/bin/herdr-pr nudge"
description = "tell agent its PR merged"

[ui]
# Adjacent panes share one divider instead of each drawing its own frame.
pane_gaps = false
# List agents as an attention queue (blocked and done first), not by workspace.
agent_panel_sort = "priority"
status_indicators = "symbols"
# Room for a session name and the context figure on each agent row.
sidebar_width = 32
sidebar_max_width = 40
# With split panes, name the agent on each pane's border.
show_agent_labels_on_pane_borders = true
# Right of the tab bar: Claude usage (written by ~/.local/bin/claude-statusline)
# and the time.
tab_bar_right = [
  { type = "command", command = "cat \"${XDG_RUNTIME_DIR:-/tmp}/claude-statusline/usage\" 2>/dev/null", interval_seconds = 30, timeout_seconds = 2 },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = "  "

# Claude rows: what the session is about, then where it runs, its state in
# words, and how full its context is. $ctx and $handoff come from
# claude-statusline; $handoff appears once it is time to hand off.
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", { token = "terminal_title_stripped", bold = true }],
  [{ token = "workspace", dim = true }, "state_text", { token = "$ctx", dim = true }, { token = "$handoff", fg = "#ff5555", bold = true }],
  # Its pull request, from ~/.local/bin/herdr-pr: CI and review state, red when
  # it needs work, green once merged.
  [{ token = "$pr", dim = true }, { token = "$pr_bad", fg = "#ff5555" }, { token = "$pr_done", fg = "#50fa7b" }],
]

[ui.toast]
# In-app toast when an agent in another workspace needs attention.
delivery = "herdr"
